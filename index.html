<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWave Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header__logo">
                <svg class="header__logo-icon" viewBox="0 0 32 32">
                    <path d="M4 16h4l3-6 4 12 4-8 3 4h4" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
                <span class="header__logo-text">SoundWave</span>
            </div>
            <nav class="header__nav">
                <a href="#" class="header__nav-link header__nav-link--active" data-page="upload">Моя музыка</a>
                <a href="#" class="header__nav-link" data-page="favorites">Избранное</a>
            </nav>
            <div class="header__user">
                <button class="header__user-btn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__section">
                <h3 class="sidebar__title">Библиотека</h3>
            </div>
            <div class="sidebar__list">
                <div class="sidebar__item sidebar__item--active" data-page="upload">
                    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <span>Все треки</span>
                </div>
                <div class="sidebar__item" data-page="favorites">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <span>Избранное</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Upload Page -->
            <section class="page page--active" id="pageUpload">
                <div class="hero" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
                    <div class="hero__content">
                        <h1 class="hero__title">Загрузи музыку</h1>
                        <p class="hero__subtitle">Перетащи аудиофайлы сюда или нажми кнопку ниже</p>
                    </div>
                </div>
                
                <div class="section">
                    <div class="upload-zone" id="dropZone">
                        <div class="upload-zone__content">
                            <svg viewBox="0 0 24 24" width="64" height="64">
                                <path d="M12 2v12M5 9l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                                <path d="M20 16v-4a4 4 0 00-4-4h-4a4 4 0 00-4 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                            </svg>
                            <p>Перетащи аудиофайлы сюда</p>
                            <span>или</span>
                            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Выбрать файлы</button>
                            <input type="file" id="fileInput" accept="audio/*" multiple hidden>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2 class="section__title">Мои треки</h2>
                    <div class="tracks-list" id="uploadedList"></div>
                </div>
            </section>

            <!-- Favorites Page -->
            <section class="page" id="pageFavorites">
                <div class="section">
                    <h2 class="section__title">Избранное</h2>
                    <div class="tracks-list" id="favoritesList"></div>
                </div>
            </section>
        </main>

        <!-- Player -->
        <div class="player">
            <div class="player__track">
                <img class="player__track-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect fill='%23242424' width='56' height='56'/%3E%3C/svg%3E" alt="Cover">
                <div class="player__track-info">
                    <span class="player__track-title" id="currentTitle">Загрузи трек</span>
                    <span class="player__track-artist" id="currentArtist">—</span>
                </div>
                <button class="player__track-fav" id="favBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
            </div>

            <div class="player__controls">
                <div class="player__buttons">
                    <button class="player__btn" id="shuffleBtn">
                        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20l5-5M3 16h5v5M21 4l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                    </button>
                    <button class="player__btn" id="prevBtn">
                        <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    </button>
                    <button class="player__btn player__btn--play" id="playBtn">
                        <svg class="player__btn-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="player__btn-icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 4h4v16H4zM14 4h4v16h-4z"/></svg>
                    </button>
                    <button class="player__btn" id="nextBtn">
                        <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    </button>
                    <button class="player__btn" id="repeatBtn">
                        <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                        <span id="repeatMode"></span>
                    </button>
                </div>
                <div class="player__progress">
                    <span class="player__time" id="currentTime">0:00</span>
                    <div class="player__progress-bar" id="progressBar">
                        <div class="player__progress-fill" id="progressFill"></div>
                    </div>
                    <span class="player__time" id="totalTime">0:00</span>
                </div>
            </div>

            <div class="player__extra">
                <div class="player__volume">
                    <button class="player__btn" id="muteBtn">
                        <svg class="player__volume-icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                        <svg class="player__volume-icon-muted" viewBox="0 0 24 24" style="display:none;"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    </button>
                    <div class="player__volume-bar" id="volumeBar">
                        <div class="player__volume-fill" id="volumeFill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="js/app.js"></script>
</body>
</html>
